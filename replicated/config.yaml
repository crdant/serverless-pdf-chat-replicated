---
apiVersion: kots.io/v1beta1
kind: Config
metadata:
  name: serverless-pdf-chat
spec:
  groups:
    - name: access
      title: Application Access
      description: |
        You can customize how you will expose Serverless PDF Chat to the internet.

        Common configurations include:

        - **ClusterIP** Using a Cluster IP and configuring your existing ingress controller to route traffic to Serverless PDF Chat
        - **NodePort** Using a NodePort and configuring an existing load balancer to route traffic to Serverless PDF Chat
        - **LoadBalancer** Using a LoadBalancer service and letting Kubernetes provision a load balancer for you

        If you're running in a supported cloud provider and want Kubernetes to provision a Load Balancer, use LoadBalancer.
      items:
        - name: domain
          title: Ingress Hostname
          help_text: >
            The domain name at which you'll access Serverless PDF Chat. Don't include
            the `https://` or any path elements.
          type: text
          required: true
          validation:
            regex:
              pattern: "^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$"
              message: Please enter a valid hostname

        - name: service_type
          title: Service Type
          type: select_one
          items:
            - name: cluster_ip
              title: ClusterIP
            - name: node_port
              title: NodePort
            - name: load_balancer
              title: LoadBalancer
          default: cluster_ip
        - name: node_port_port
          title: Node Port
          help_text: >
              (Optional) - The port to use for the NodePort service type. Leave this blank to have Kubernetes choose a port for you.
          type: text
          default: "443"
          when: repl{{ ConfigOptionEquals "service_type" "node_port" }}

    - name: tls
      title: Certificates
      description: |
        You can secure the Serverless PDF Chat application with certificates from a trusted certificate authority
        or we can generate them for you. We recommend that you upload your own certificates for production installations.
      items:
        - name: certificate_source
          type: select_one
          title: Certificate Source
          default: generate_internal
          items:
            - name: generate_internal
              title: Generate
            - name: upload_existing
              title: Upload
        - name: tls_cert
          title: Certificate
          type: file
          when: '{{repl ConfigOptionEquals "certificate_source" "upload_existing"}}'
        - name: tls_key
          title: Private Key
          type: file
          when: '{{repl ConfigOptionEquals "certificate_source" "upload_existing"}}'
        - name: tls_ca
          title: Signing Authority
          type: file
          when: '{{repl ConfigOptionEquals "certificate_source" "upload_existing"}}'
        - name: generated_tls
          title: Generated TLS
          type: textarea
          hidden: true
          default: |-
            repl{{ $ca := genCA (ConfigOption "domain") 365 }}
            repl{{ $tls := dict "ca" $ca }}
            repl{{ $cert := genSignedCert (ConfigOption "domain") (list ) (list (ConfigOption "domain")) 365 $ca }}
            repl{{ $_ := set $tls "cert" $cert }}
            repl{{ toJson $tls }}
          when: '{{repl ConfigOptionEquals "certificate_source" "generate_internal"}}'

    - name: model
      title: AI Model Configuration
      description: |
        Select the Amazon Bedrock models to use for text generation and document embeddings. Different models have different capabilities,
        costs, and performance characteristics.
        
        Models are grouped by provider (Amazon, Anthropic, Cohere, Meta, and Mistral) and range from smaller,
        faster models to larger models with more advanced reasoning capabilities.
      items:
        - name: model_id
          title: Text Generation Model
          help_text: >
            Select the Amazon Bedrock model to use for generating text responses.
            
            For this chat application, we recommend using models built for chat interactions,
            which can better understand conversation context and maintain coherence.
          type: select_one
          default: meta.llama3-1-405b-instruct-v1:0
          items:
            # Anthropic models - All support chat capabilities
            - name: anthropic.claude-3-5-sonnet-20241022-v2:0
              title: Anthropic Claude 3.5 Sonnet (Oct 2024) - Recommended
            - name: anthropic.claude-3-5-haiku-20241022-v1:0
              title: Anthropic Claude 3.5 Haiku (Oct 2024) - Fast
            - name: anthropic.claude-3-sonnet-20240229-v1:0
              title: Anthropic Claude 3 Sonnet (Feb 2024)
            - name: anthropic.claude-3-haiku-20240307-v1:0
              title: Anthropic Claude 3 Haiku (Mar 2024)
            - name: anthropic.claude-3-opus-20240229-v1:0
              title: Anthropic Claude 3 Opus (Feb 2024) - Highest Quality
            - name: anthropic.claude-v2:1
              title: Anthropic Claude 2.1
            - name: anthropic.claude-v2
              title: Anthropic Claude 2
            - name: anthropic.claude-instant-v1
              title: Anthropic Claude Instant
              
            # Meta models - All support chat capabilities  
            - name: meta.llama3-1-405b-instruct-v1:0
              title: Meta Llama 3.1 405B Instruct - Recommended
            - name: meta.llama3-1-70b-instruct-v1:0
              title: Meta Llama 3.1 70B Instruct
            - name: meta.llama3-70b-instruct-v1:0
              title: Meta Llama 3 70B Instruct
            - name: meta.llama3-8b-instruct-v1:0
              title: Meta Llama 3 8B Instruct
              
            # Mistral models - All support chat capabilities
            - name: mistral.mistral-large-2407-v1:0
              title: Mistral Large (Jul 2024) - Recommended
            - name: mistral.mistral-large-2402-v1:0
              title: Mistral Large (Feb 2024)
            - name: mistral.mixtral-8x7b-instruct-v0:1
              title: Mistral Mixtral 8x7B Instruct
            - name: mistral.mistral-7b-instruct-v0:2
              title: Mistral 7B Instruct
              
            # Cohere models - All support chat capabilities
            - name: cohere.command-r-plus-v1:0
              title: Cohere Command R+ - Recommended
            - name: cohere.command-r-v1:0
              title: Cohere Command R
            - name: cohere.command-text-v14
              title: Cohere Command Text
            - name: cohere.command-light-text-v14
              title: Cohere Command Light Text

        - name: embedding_model_id
          title: Embedding Model
          help_text: >
            Select the Amazon Bedrock model to use for generating document embeddings.
          type: select_one
          default: amazon.titan-embed-text-v2:0
          items:
            - name: amazon.titan-embed-g1-text-02
              title: Amazon Titan Embed G1 Text
            - name: amazon.titan-embed-text-v1
              title: Amazon Titan Embed Text v1
            - name: amazon.titan-embed-text-v2:0
              title: Amazon Titan Embed Text v2
            - name: amazon.titan-embed-image-v1
              title: Amazon Titan Embed Image
            - name: cohere.embed-english-v3
              title: Cohere Embed English
            - name: cohere.embed-multilingual-v3
              title: Cohere Embed Multilingual
              
    - name: aws
      title: AWS Configuration
      description: |
        This section can be used to configure the AWS resources required by Serverless PDF Chat. The application
        will create new resources in your AWS account.

        Be sure the AWS credentials you provide have the necessary permissions to create resources in your AWS account.
      items:
        - name: aws_account_id
          title: AWS Account ID
          help_text: >
            The AWS account ID for backend resources
          type: text
          required: true
          validation:
            regex:
              pattern: '^\d{12}$'
              message: Please enter your 12-digit AWS account ID. You can find your account ID in the AWS Management Console.
        - name: aws_region
          title: AWS Region
          help_text: >
            Select the AWS region to use for the backend
          type: dropdown
          required: true
          default: us-east-1
          items:
            - name: us-east-1
              title: US East (N. Virginia)
            - name: us-east-2
              title: US East (Ohio)
            - name: us-west-1
              title: US West (N. California)
            - name: us-west-2
              title: US West (Oregon)
            - name: af-south-1
              title: Africa (Cape Town)
            - name: ap-east-1
              title: Asia Pacific (Hong Kong)
            - name: ap-south-1
              title: Asia Pacific (Mumbai)
            - name: ap-northeast-3
              title: Asia Pacific (Osaka)
            - name: ap-northeast-2
              title: Asia Pacific (Seoul)
            - name: ap-southeast-1
              title: Asia Pacific (Singapore)
            - name: ap-southeast-2
              title: Asia Pacific (Sydney)
            - name: ap-northeast-1
              title: Asia Pacific (Tokyo)
            - name: ca-central-1
              title: Canada (Central)
            - name: eu-central-1
              title: Europe (Frankfurt)
            - name: eu-west-1
              title: Europe (Ireland)
            - name: eu-west-2
              title: Europe (London)
            - name: eu-south-1
              title: Europe (Milan)
            - name: eu-west-3
              title: Europe (Paris)
            - name: eu-north-1
              title: Europe (Stockholm)
            - name: me-south-1
              title: Middle East (Bahrain)
            - name: sa-east-1
              title: South America (São Paulo)
        - name: aws_access_key_id
          title: AWS Access Key ID
          type: password
          help_text: >
            The AWS access key ID to use for authentication
          required: true
        - name: aws_secret_access_key
          title: AWS Secret Access Key
          type: password
          help_text: >
            The AWS secret access key to use for authentication
          required: true

