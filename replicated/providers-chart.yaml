apiVersion: kots.io/v1beta2
kind: HelmChart
metadata:
  name: providers
spec:
  # chart identifies a matching chart from a .tgz
  chart:
    name: providers
    chartVersion: 0.12.0
  namespace: serverless-pdf-chat
  weight: -30

  helmUpgradeFlags:
    - --wait

  values: 
    global:
      images:
        pullSecrets:
          - '{{repl ImagePullSecretName}}'

  optionalValues:
    - when: '{{repl HasLocalRegistry}}'
      recursiveMerge: true
      values: 
        global:
          images: 
            registry: '{{repl LocalRegistryHost}}'

    - when: '{{repl not HasLocalRegistry}}'
      recursiveMerge: true
      values: 
        global:
          images: 
            registry: 'images.shortrib.io/proxy/{{repl LicenseFieldValue "appSlug"}}/429114214526.dkr.ecr.us-west-2.amazonaws.com'
