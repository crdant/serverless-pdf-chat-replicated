apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "providers.fullname" . }}-cleanup
  labels: {{- include "providers.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
    {{- include "providers.annotations" . | nindent 4 }}
spec:
  template:
    metadata:
      name: {{ include "providers.fullname" . }}-cleanup
    spec:
      serviceAccountName: {{ include "providers.serviceAccountName" . }}
      restartPolicy: Never
      {{- with .Values.jobs.cleanupJob.securityContext }}
      securityContext:
        runAsNonRoot: {{ .runAsNonRoot }}
        runAsUser: {{ .runAsUser }}
        runAsGroup: {{ .runAsGroup }}
      {{- end }}
      containers:
      - name: kubectl
        image: {{ include "providers.jobRegistry" (dict "Values" .Values "jobType" "cleanup") }}/{{ .Values.jobs.cleanupJob.image.repository }}:{{ .Values.jobs.cleanupJob.image.tag | default "latest" }}
        {{- if .Values.jobs.cleanupJob.image.pullPolicy }}
        imagePullPolicy: {{ .Values.jobs.cleanupJob.image.pullPolicy }}
        {{- end }}
        {{- with .Values.jobs.cleanupJob.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
        - /bin/sh
        - -c
        - |
          # Delete providers
          {{- range $key, $value := .Values.aws.providers }}
          {{- if ne $key "registry" }}
          kubectl delete provider.pkg.crossplane.io {{ include "providers.fullname" $ }}-aws-{{ $key }} --ignore-not-found
          {{- end }}
          {{- end }}
          
          # Delete kubernetes provider
          kubectl delete provider.pkg.crossplane.io {{ include "providers.fullname" $ }}-kubernetes --ignore-not-found
          
          # Wait for cleanup to complete
          sleep 10
