# Default values for crossplane-providers chart
nameOverride: ""
fullnameOverride: ""

aws:
  # Deployment runtime configuration
  deploymentRuntimeConfig:
    # Resource limits for provider controllers
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    # Security context for provider controllers
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
  # AWS provider configurations
  providers:
    # Registry for all providers
    registry: "xpkg.upbound.io/upbound"
    family:
      package: "provider-family-aws"
      version: "v1.21.1"
    iam:
      package: "provider-aws-iam"
      version: "v1.21.1"
    s3:
      package: "provider-aws-s3"
      version: "v1.21.1"
    dynamodb:
      package: "provider-aws-dynamodb"
      version: "v1.21.1"
    lambda:
      package: "provider-aws-lambda"
      version: "v1.21.1"
    sqs:
      package: "provider-aws-sqs"
      version: "v1.21.1"
    apigatewayv2:
      package: "provider-aws-apigatewayv2"
      version: "v1.21.1"
    cognitoidp:
      package: "provider-aws-cognitoidp"
      version: "v1.21.1"
    bedrock:
      package: "provider-aws-bedrock"
      version: "v1.21.1"
    cloudfront:
      package: "provider-aws-cloudfront"
      version: "v1.21.1"
    secretsmanager:
      package: "provider-aws-secretsmanager"
      version: "v1.21.1"

kubernetes:
  provider:
    version: "v0.17.2"
    registry: "xpkg.upbound.io/upbound"
